<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Injera Board Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
        }
        
        .board-section {
            flex: 1;
            background: #f5e6d3;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .sidebar {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .panel {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        h2 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: #fff8dc;
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }
        
        .player-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .player-card.current {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.5);
        }
        
        .score {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .card-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 10px 0;
        }
        
        .card {
            background: #fff;
            color: #333;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            border: 2px solid #667eea;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin: 5px 0;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .legend {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.6;
        }
        
        .dish-count {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        
        .eaten-dishes {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    .player-card.ai {
    background: linear-gradient(135deg, #FA8BFF 0%, #2BD2FF 90%, #2BFF88 100%);
}

.player-card.ai::before {
    content: "🤖 ";
    font-size: 20px;
}

.ai-thinking {
    color: #667eea;
    font-weight: bold;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}
    </style>
</head>

            const n = numPlayers;

            const mode = hasAI ? 'n' : 'h';
            const data = {version: '1.0', num_players: n, steps: gameRecording};
            fetch('http://localhost:5000/save_recording', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({data: data, ts: ts, mode: mode})
            }).then(r => r.json()).then(r => {

        function drawHexagon(x, y, size, fillColor, strokeColor = 'black', lineWidth = 2) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = Math.PI / 3 * i;
                const px = x + size * Math.cos(angle);
                const py = y + size * Math.sin(angle);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineWidth;
            ctx.stroke();

        function drawCards(player, count = null) {
            // If count is not specified, draw to fill hand
            const cardsToDraw = count !== null ? count : (player.maxHandSize - player.hand.length);
            
            if (cardsToDraw <= 0) {
                return 0; // Hand already full or no cards to draw
            }
            
            let cardsDrawn = 0;
            
            // Draw cards one at a time, reshuffling if needed mid-draw
            for (let i = 0; i < cardsToDraw; i++) {
                // Calculate total cards available in current composition
                const total = Object.values(deckData.composition).reduce((a, b) => a + b, 0);
                
                // Check if deck needs reshuffling (composition is empty)
                if (total === 0) {
                    deckData.composition = {
                        'Injera': 30,
                        'Rotate': 10,
                        'Tahini': 6,
                        'Coffee': 3,
                        'Beer': 3,
                        'Water': 3,
                        'HotSauce': 5
                    };
                    deckData.cardsRemaining = 60;
                    deckData.deckSize = 60;
                    console.log('DECK RESHUFFLED! Starting with fresh 60 cards.');
                }
                
                // Recalculate total after potential reshuffle
                const totalAfterReshuffle = Object.values(deckData.composition).reduce((a, b) => a + b, 0);
                
                if (totalAfterReshuffle === 0) {
                    // No cards left even after reshuffle attempt (shouldn't happen with infinite reshuffles)
                    console.log('WARNING: No cards available even after reshuffle!');
                    break;
                }
                
                // Weighted random based on actual deck composition
                const rand = Math.random() * totalAfterReshuffle;
                let cumulative = 0;
                let drawnType = null;
                
                for (const [cardType, count] of Object.entries(deckData.composition)) {
                    cumulative += count;
                    if (rand < cumulative) {
                        drawnType = cardType;
                        break;
                    }
                }
                
                // Create card based on type
                let newCard;
                if (drawnType === 'Injera') {
                    newCard = {type: 'Clean Injera', name: 'Clean Injera'};
                } else if (drawnType === 'Rotate') {
                    newCard = {type: 'Rotate', name: 'Rotate Injera'};
                } else if (drawnType === 'Tahini') {
                    newCard = {type: 'Tahini', name: 'Tahini'};
                } else if (drawnType === 'Coffee') {
                    newCard = {type: 'Drink', name: 'Order Coffee'};
                } else if (drawnType === 'Beer') {
                    newCard = {type: 'Drink', name: 'Order Beer'};
                } else if (drawnType === 'Water') {
                    newCard = {type: 'Drink', name: 'Order Water'};
                } else if (drawnType === 'HotSauce') {
                    newCard = {type: 'Hot Sauce', name: 'Add Hot Sauce'};
                }

                player.hand.push(newCard);
                player.cardsDealt = player.cardsDealt || {};
                player.cardsDealt[drawnType] = (player.cardsDealt[drawnType] || 0) + 1;

                // Update deck composition
                deckData.composition[drawnType]--;
                if (deckData.composition[drawnType] === 0) {
                    delete deckData.composition[drawnType];
                }
                deckData.cardsRemaining--;
                deckData.deckSize--;
                cardsDrawn++;
            }
            
            return cardsDrawn;
        }
        
        // Shuffle array in place (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

            for (let i = 0; i < 3; i++) freshDeck.push({type: 'Drink', name: 'Order Beer'});
            for (let i = 0; i < 3; i++) freshDeck.push({type: 'Drink', name: 'Order Water'});
            for (let i = 0; i < 5; i++) freshDeck.push({type: 'Hot Sauce', name: 'Add Hot Sauce'});
            
            shuffleArray(freshDeck);
            
            // Deal cards to players (first player gets one fewer card)
            playersData.forEach((player, idx) => {
                player.hand = [];
                const dealCount = player.maxHandSize - (idx === 0 ? 1 : 0);
                for (let i = 0; i < dealCount; i++) {
                    if (freshDeck.length > 0) {
                        player.hand.push(freshDeck.pop());
                    }
                }
            });
            
            // Update deck composition based on remaining cards
            deckData.composition = {Injera: 0, Rotate: 0, Tahini: 0, Coffee: 0, Beer: 0, Water: 0, HotSauce: 0};
            freshDeck.forEach(card => {
                if (card.type === 'Clean Injera') deckData.composition.Injera++;
                else if (card.name === 'Rotate Injera') deckData.composition.Rotate++;
                else if (card.name === 'Tahini') deckData.composition.Tahini++;
                else if (card.name === 'Order Coffee') deckData.composition.Coffee++;
                else if (card.name === 'Order Beer') deckData.composition.Beer++;
                else if (card.name === 'Order Water') deckData.composition.Water++;
                else if (card.name === 'Add Hot Sauce') deckData.composition.HotSauce++;
            });
            deckData.cardsRemaining = freshDeck.length;
            deckData.deckSize = freshDeck.length;
        }
        
        function calculateFinalScores() {
            // Calculate variety bonus: 0-4 types = 0, 5 types = 5, 6 types = 12, 7 types = 21
            // Calculate completion bonuses: 5 tiles = +5, 6 tiles = +10, 7 tiles = +15 (for each dish type)
            const results = playersData.map(player => {
                const uniqueDishTypes = new Set(player.eaten);
                const numTypes = uniqueDishTypes.size;
                let varietyBonus = 0;
                if (numTypes === 5) varietyBonus = 5;
                else if (numTypes === 6) varietyBonus = 12;
                else if (numTypes === 7) varietyBonus = 21;
                
                // Calculate completion bonuses for each dish type
                let completionBonus = 0;
                const completionDetails = [];
                if (player.dishCounts) {
                    for (const [dishName, count] of Object.entries(player.dishCounts)) {
                        if (count === 5) {
                            completionBonus += 5;
                            completionDetails.push(`${dishName} (5): +5`);
                        } else if (count === 6) {
                            completionBonus += 10;
                            completionDetails.push(`${dishName} (6): +10`);
                        } else if (count === 7) {
                            completionBonus += 15;
                            completionDetails.push(`${dishName} (7): +15`);
                        }
                    }
                }
                
                // Calculate special card bonuses
                let specialCardBonus = 0;
                const specialCardDetails = [];
                if (specialCardsEnabled && player.specialCards) {
                    player.specialCards.forEach(card => {
                        const cardDef = SPECIAL_CARDS_DECK.find(c => c.id === card.id);
                        if (cardDef) {
                            const pts = cardDef.score(player, playersData);
                            specialCardBonus += pts;
                            specialCardDetails.push({name: card.name, points: pts});
                        }
                    });
                }

                const finalScore = player.score + varietyBonus + completionBonus + specialCardBonus;
                return {
                    name: player.name,
                    score: player.score,
                    varietyBonus: varietyBonus,
                    completionBonus: completionBonus,
                    completionDetails: completionDetails,
                    specialCardBonus: specialCardBonus,
                    specialCardDetails: specialCardDetails,
                    finalScore: finalScore,
                    dishTypes: uniqueDishTypes.size
                };
            });
            
            return results;
        }
        
        function saveGameData(results, ts) {

                (player.eaten || []).forEach(d => { dishesEaten[d] = (dishesEaten[d] || 0) + 1; });
                return {
                    player_idx: idx,
                    checkpoint: player.isAI ? 'neural_ai/models/checkpoint_latest.pt' : 'human',

            });

        function endGameNow() {
            if (!confirm('End the game now and calculate final scores?')) {
                return;
            }
            
            const results = calculateFinalScores();
            results.sort((a, b) => b.finalScore - a.finalScore);
            
            let message = '🎉 GAME OVER! 🎉\n\n';
            message += 'FINAL SCORES:\n';
            message += '═══════════════════\n\n';
            
            results.forEach((r, idx) => {
                message += formatPlayerScore(r, idx);
            });

            alert(message);
            saveGameEnd(results);
        }

        function formatPlayerScore(r, idx) {
            let msg = `${idx + 1}. ${r.name}: ${r.finalScore} points\n`;
            msg += `   Base score: ${r.score}\n`;
            msg += `   Variety bonus: +${r.varietyBonus} (${r.dishTypes} unique dish types)\n`;
            if (r.completionBonus > 0) {
                msg += `   Completion bonus: +${r.completionBonus} (${r.completionDetails.join(', ')})\n`;
            }
            if (r.specialCardBonus > 0 || (r.specialCardDetails && r.specialCardDetails.length > 0)) {
                msg += `   Special cards: +${r.specialCardBonus}\n`;
                r.specialCardDetails.forEach(sc => {
                    msg += `      ${sc.name}: +${sc.points}\n`;
                });
            }
            msg += `\n`;
            return msg;
        }

        function nextTurn() {
            recordAction({action_type: 'end_turn', player_id: currentPlayerIdx});
            saveStateForUndo();
            turnCount++;
            const dishesRemaining = boardData.filter(t => !t.empty && !t.removed).length;

            // Refill hand for the player who just ended their turn (not during final round).
            const endingPlayer = playersData[currentPlayerIdx];
            const penalty = endingPlayer.pendingBeerPenalty || 0;
            endingPlayer.pendingBeerPenalty = 0;
            if (!finalRoundActive) {
                const refillTarget = endingPlayer.maxHandSize - penalty;
                const refillNeeded = refillTarget - endingPlayer.hand.length;
                if (refillNeeded > 0) drawCards(endingPlayer, refillNeeded);
            }

            // Check for stalemate: two full rounds (2 × numPlayers turns) without any dish eaten
            // Round starts at the first player who didn't eat, so we count consecutive no-eat turns
            if (!finalRoundActive) {
                if (dishEatenThisTurn) {
                    noEatStreakTurns = 0;
                } else {
                    noEatStreakTurns++;
                    if (noEatStreakTurns >= playersData.length) {
                        const results = calculateFinalScores();
                        results.sort((a, b) => b.finalScore - a.finalScore);
                        let message = '🎉 GAME OVER! No dishes were eaten for a full round! 🎉\n\n';
                        message += 'FINAL SCORES:\n';
                        message += '═══════════════════\n\n';
                        results.forEach((r, idx) => { message += formatPlayerScore(r, idx); });
                        alert(message);
                        saveGameEnd(results);
                        return;
                    }
                }
            }
            dishEatenThisTurn = false;

            // Move to next player
            currentPlayerIdx = (currentPlayerIdx + 1) % playersData.length;
            waterRefilledThisTurn[currentPlayerIdx] = false; // Reset water refill flag
            const currentPlayer = playersData[currentPlayerIdx];

            // Check if we're in final round and have completed it
            if (finalRoundActive && currentPlayerIdx === finalRoundStartPlayer) {
                // Final round complete - end game
                const results = calculateFinalScores();
                results.sort((a, b) => b.finalScore - a.finalScore);

                let message = '🎉 GAME OVER! Final round complete! 🎉\n\n';
                message += 'FINAL SCORES:\n';
                message += '═══════════════════\n\n';

                results.forEach((r, idx) => {
                    message += formatPlayerScore(r, idx);
                });

                alert(message);
                saveGameEnd(results);
                return;
            }

            // New player's turn starts with their existing hand (filled at end of previous turn)
            const drawn = 0; // No draw at start of turn anymore
            
            const finalRoundMsg = finalRoundActive ? ' [FINAL ROUND]' : '';
            {
                alert(`${currentPlayer.name}'s turn!${finalRoundMsg}\nHand: ${currentPlayer.hand.length} cards.`);
            }
            
            updatePlayersPanel();
            updateGameStatus();
            drawBoard(); // Redraw to show new player's reachable tiles
            handleAITurnIfNeeded();
        }

        /**
         * Handle drink finishing - apply effects and check if turn should end
         * Returns true if turn should end (Coffee/Beer finished), false otherwise
         */
        // deferDraw: if true, skip drawCards now and return deferredDrawTarget instead.
        // Used when called from inside a hot-handling loop so the hand refill happens
        // only after all hot-handling (including injera card discards) is complete.
        function handleDrinkFinished(player, drinkType, deferDraw = false) {
            let effectMessage = '';

            if (drinkType === 'Coffee') {
                // Coffee: +3 pts when finished, refill hand to max_hand_size + 1, ALWAYS ends turn
                player.score += 3;
                const target = player.maxHandSize + 1;
                const toDraw = target - player.hand.length;
                if (toDraw > 0 && !finalRoundActive) drawCards(player, toDraw);
                effectMessage = ` - Coffee finished! +3 pts. Hand refilled to ${player.hand.length} cards. Turn ends!`;
                return {shouldEndTurn: true, message: effectMessage};
            } else if (drinkType === 'Beer') {
                // Beer: +6 pts when finished, next end-of-turn refill is to hand_size - 1, ALWAYS ends turn
                player.score += 6;
                player.pendingBeerPenalty = (player.pendingBeerPenalty || 0) + 1;
                effectMessage = ` - Beer finished! +6 pts. Next refill -1 card. Turn ends!`;
                return {shouldEndTurn: true, message: effectMessage};
            } else if (drinkType === 'Water') {
                if (!waterRefilledThisTurn[currentPlayerIdx]) {
                    // First Water this turn: refill hand
                    waterRefilledThisTurn[currentPlayerIdx] = true;
                    if (deferDraw) {
                        effectMessage = ` - Water finished! Hand will be refilled.`;
                        return {shouldEndTurn: false, deferredDrawTarget: player.maxHandSize, message: effectMessage};
                    }
                    const cardsNeeded = player.maxHandSize - player.hand.length;
                    if (cardsNeeded > 0) {
                        const drawn = drawCards(player, cardsNeeded);
                        effectMessage = ` - Water finished! Refilled hand! Drew ${drawn} cards`;
                    } else {
                        effectMessage = ` - Water finished! Hand was already full`;
                    }
                    return {shouldEndTurn: false, message: effectMessage};
                } else {
                    // Second+ Water this turn: end turn, no refill
                    effectMessage = ` - Second Water finished! Turn ends!`;
                    return {shouldEndTurn: true, message: effectMessage};
                }
            }

            return {shouldEndTurn: false, message: effectMessage};
        }

        async function testEat() {
            const preActionState = buildStateSnapshot();
            const currentPlayer = playersData[currentPlayerIdx];
            
            // Check if a tile is selected
            if (!selectedTile) {
                alert('Please select a tile first by clicking on it!');
                return;
            }
            
            // Require discarding a card to eat
            if (currentPlayer.hand.length === 0) {
                alert('You need at least 1 card in hand to eat!');
                return;
            }
            
            // Check if tile is reachable
            const currentReachable = getCurrentReachableTiles();
            const isReachable = currentReachable.some(c => c.q === selectedTile.q && c.r === selectedTile.r);
            if (!isReachable) {
                alert('You cannot reach this tile! It is outside your reachable area (shown with light green glow).');
                return;
            }
            
            // Check if it's removed
            if (selectedTile.removed) {
                alert('This tile has been removed from the board!');
                return;
            }
            
            // Check if the selected tile has a dish
            if (selectedTile.empty || !selectedTile.dish) {
                alert('This tile is empty - use "Eat Empty Tile" to remove it from the board!');
                return;
            }
            
            // Check if it's a hot dish - need drink/injera/adjacent tahini to handle hotness
            // Use effective hotness (tahini on dish tile reduces, hot sauce increases)
            const isBerbereGate = selectedTile.dish === 'Key Sir';
            const baseDishHotCheck = selectedTile.hot ? (isBerbereGate ? 2 : 1) : 0;
            const effectiveDishHotCheck = Math.max(0, baseDishHotCheck + (selectedTile.hotSauce || 0) - (selectedTile.tahini || 0));
            if (effectiveDishHotCheck > 0) {
                const activeDrinks = currentPlayer.drinks.filter(d => d.tokens > 0);
                const injeraCards = currentPlayer.hand.filter(c => c.type === 'Clean Injera');
                // Adjacent empty tiles with excess tahini (beyond their own hotness) can also handle dish hotness
                const adjacentTilesForCheck = getAdjacentEmptyTiles(selectedTile.q, selectedTile.r);
                const hasAdjacentExcessTahini = adjacentTilesForCheck.some(t => {
                    const isBerbereT = Math.abs(t.q) <= 1 && Math.abs(t.r) <= 1 && Math.abs(t.q + t.r) <= 1;
                    const tBaseHot = t.hotToken ? (isBerbereT ? 2 : 1) : 0;
                    const excess = Math.max(0, (t.tahini || 0) - tBaseHot - (t.hotSauce || 0));
                    return excess >= effectiveDishHotCheck;
                });
                if (activeDrinks.length === 0 && injeraCards.length === 0 && !hasAdjacentExcessTahini) {
                    alert('This is a hot dish! You need either:\n- An active drink (with tokens), OR\n- An Injera card, OR\n- An adjacent empty tile with tahini');
                    return;
                }
            }
            
            // Check if player can eat this dish
            // Need either: (1) Injera card, OR (2) Adjacent empty tile
            const injeraCards = currentPlayer.hand.filter(c => c.type === 'Clean Injera');
            const adjacentEmptyTiles = getAdjacentEmptyTiles(selectedTile.q, selectedTile.r);
            
            console.log('Injera cards:', injeraCards.length);
            console.log('Adjacent eatable empty tiles:', adjacentEmptyTiles.length);
            console.log('Adjacent tiles detail:', adjacentEmptyTiles);
            
            if (injeraCards.length === 0 && adjacentEmptyTiles.length === 0) {
                alert('Cannot eat this dish! You need either:\n- An Injera card in your hand, OR\n- An adjacent eatable empty tile (with green outline)');
                return;
            }
            
            // STEP 1: DISCARD A CARD FIRST (original order)
            saveStateForUndo();
            let discardedCard;
            if (currentPlayer.hand.length === 1) {
                // Only one card, discard it
                discardedCard = currentPlayer.hand.pop();
            } else {
                const allSame = currentPlayer.hand.every(c => c.name === currentPlayer.hand[0].name);
                if (allSame) {
                    discardedCard = currentPlayer.hand.splice(0, 1)[0];
                } else {
                    // Deduplicate: show each unique card name once
                    const seen = new Set();
                    const uniqueOptions = [];
                    const uniqueIndices = [];
                    currentPlayer.hand.forEach((c, i) => {
                        if (!seen.has(c.name)) {
                            seen.add(c.name);
                            uniqueOptions.push(c.name);
                            uniqueIndices.push(i);
                        }
                    });
                    const choice = await showSelectionModal('Choose a card to discard:', uniqueOptions);
                    if (choice === null) return;
                    discardedCard = currentPlayer.hand.splice(uniqueIndices[choice], 1)[0];
                }
            }
            const discardMessage = `Discarded ${discardedCard.name}`;
            
            // STEP 2: Now choose resource (injera card or empty tile)
            // Build options list
            let options = [];
            let optionTypes = [];
            
            // Add injera card option (all injera cards are identical — one option suffices)
            const remainingInjeraCards = currentPlayer.hand.filter(c => c.type === 'Clean Injera');
            if (remainingInjeraCards.length > 0) {
                options.push('Injera Card');
                optionTypes.push({type: 'card', index: 0});
            }
            
            // Helper function to get direction label from hex coordinates
            function getDirectionLabel(fromQ, fromR, toQ, toR) {
                const dq = toQ - fromQ;
                const dr = toR - fromR;
                
                // Hex direction mapping (in axial coordinates)
                if (dq === 1 && dr === 0) return '↘';
                if (dq === 1 && dr === -1) return '↗';
                if (dq === 0 && dr === -1) return '↑';
                if (dq === -1 && dr === 0) return '↖';
                if (dq === -1 && dr === 1) return '↙';
                if (dq === 0 && dr === 1) return '↓';
                
                return `(${toQ}, ${toR})`; // Fallback to coordinates
            }
            
            // Add adjacent empty tile options
            adjacentEmptyTiles.forEach((tile, idx) => {
                const direction = getDirectionLabel(selectedTile.q, selectedTile.r, tile.q, tile.r);
                const tahiniLabel = tile.tahini > 0 ? ` +${tile.tahini}` : '';
                const isTileExtraHot = Math.abs(tile.q) <= 1 && Math.abs(tile.r) <= 1 && Math.abs(tile.q + tile.r) <= 1;
                const baseTileHot = tile.hotToken ? (isTileExtraHot ? 2 : 1) : 0;
                const effectiveHot = Math.max(0, baseTileHot + (tile.hotSauce || 0) - (tile.tahini || 0));
                const hotLabel = effectiveHot > 0 ? ' ' + '🔥'.repeat(effectiveHot) : '';
                options.push(`Empty Tile ${direction}${tahiniLabel}${hotLabel}`);
                optionTypes.push({type: 'tile', tile: tile});
            });
            
            // If only one option, or all options are identical injera cards, use first automatically
            let selectedOption = 0;
            const allInjeraOptions = optionTypes.length > 0 && optionTypes.every(o => o.type === 'card');
            if (options.length > 1 && !allInjeraOptions) {
                console.log('Multiple options available:', options);

                // Create custom modal for selection
                selectedOption = await showSelectionModal(
                    'Choose how to eat this dish:',
                    options
                );
                
                console.log('User selected option:', selectedOption);
                
                if (selectedOption === null) {
                    // User cancelled - restore the discarded card
                    console.log('User cancelled selection');
                    currentPlayer.hand.push(discardedCard);
                    alert('Cancelled! Card returned to hand.');
                    return;
                }
            } else {
                console.log('Only one option, using automatically:', options[0]);
            }
            
            console.log('Proceeding with option:', optionTypes[selectedOption]);
            
            const chosen = optionTypes[selectedOption];
            
            // PRE-CHECK: Will hot handling succeed? Calculate requirements first
            const dishName = selectedTile.dish;
            const wasHot = selectedTile.hot;
            const isBerbere = dishName === 'Key Sir';
            const baseDishHot = wasHot ? (isBerbere ? 2 : 1) : 0;
            let needsHotDish = Math.max(0, baseDishHot + (selectedTile.hotSauce || 0) - (selectedTile.tahini || 0));
            // Excess tahini on the dish (beyond what covers the dish's own hotness)
            const dishHotToAbsorb = baseDishHot + (selectedTile.hotSauce || 0);
            const excessDishTahini = Math.max(0, (selectedTile.tahini || 0) - dishHotToAbsorb);

            let needsHotTile = 0;
            let usedEmptyTile = null;
            if (chosen.type === 'tile') {
                usedEmptyTile = chosen.tile;
                const isBerbereEmptyTile = Math.abs(usedEmptyTile.q) <= 1 && Math.abs(usedEmptyTile.r) <= 1 &&
                                        Math.abs(usedEmptyTile.q + usedEmptyTile.r) <= 1;
                const baseEmptyHot = usedEmptyTile.hotToken ? (isBerbereEmptyTile ? 2 : 1) : 0;
                needsHotTile = Math.max(0, baseEmptyHot + (usedEmptyTile.hotSauce || 0) - (usedEmptyTile.tahini || 0));
                // Excess tahini on the dish (beyond the dish's own hotness) also reduces empty tile hotness
                needsHotTile = Math.max(0, needsHotTile - excessDishTahini);
                // Excess tahini on the eating tile (beyond its own hotness) handles the dish's hotness
                const tileHotnessToAbsorb = baseEmptyHot + (usedEmptyTile.hotSauce || 0);
                const excessTileTahini = Math.max(0, (usedEmptyTile.tahini || 0) - tileHotnessToAbsorb);
                needsHotDish = Math.max(0, needsHotDish - excessTileTahini);
            }
            
            const totalHotHandling = needsHotDish + needsHotTile;
            
            // NOW check if player has enough resources for hot handling (AFTER discarding!)
            if (totalHotHandling > 0) {
                const availableDrinks = currentPlayer.drinks.filter(d => d.tokens > 0).reduce((sum, d) => sum + d.tokens, 0);
                let availableInjera = currentPlayer.hand.filter(c => c.type === 'Clean Injera').length;

                // IMPORTANT: If eating with an injera card, that injera is NOT available for hot handling!
                if (chosen.type === 'card') {
                    availableInjera = Math.max(0, availableInjera - 1);
                }

                const totalHotResources = availableDrinks + availableInjera;

                if (totalHotResources < totalHotHandling) {
                    // Not enough resources! Restore the discarded card
                    currentPlayer.hand.push(discardedCard);
                    alert(`Not enough resources for hot handling! Need ${totalHotHandling}, have ${totalHotResources} (drinks: ${availableDrinks}, injera: ${availableInjera})\n\nCard returned to hand.`);
                    return;
                }
            }
            
            // Execute the eating - consume resources
            let resourceMessage = '';
            let emptyTileTahini = 0;
            let resourceToConsume = chosen; // Store what we'll consume later

            }

            // Track tahini consumed (dish tile + empty tile if used)
            if (tahiniValue > 0) {
                currentPlayer.tahiniConsumed = (currentPlayer.tahiniConsumed || 0) + tahiniValue;
            }
            if (emptyTileTahini > 0) {
                currentPlayer.tahiniConsumed = (currentPlayer.tahiniConsumed || 0) + emptyTileTahini;
            }

            // Track hot dish counts for special cards
            // A dish is "hot" if inherently hot OR tile had hot sauce (tahini doesn't change this)
            const isBerbereDish = (dishName === 'Key Sir');
            const dishInherentlyHot = (dishName === 'Kik Alicha' || dishName === 'Misir Wot' || dishName === 'Tikel Gomen' || isBerbereDish);
            const dishCountsAsHot = dishInherentlyHot || (selectedTile.hotSauce || 0) > 0;
            if (dishCountsAsHot && !isBerbereDish) {

            // Completion bonuses (5, 6, 7 tiles) are calculated at end of game

            // This prevents offering the same injera card for both eating and hot handling
            if (resourceToConsume.type === 'card') {
                // Remove the injera card used for eating

                if (cardIdx === -1) {

                }
                currentPlayer.hand.splice(cardIdx, 1);
            } else {
                // Remove the empty tile (do this now, not later)
                resourceToConsume.tile.removed = true;
            }

            // Pre-check: if this tile is the last dish, set finalRoundActive now so that

            const nonEmptyAfter = boardData.filter(t => !t.empty && !t.removed && !(t.q === selectedTile.q && t.r === selectedTile.r)).length;
            if (nonEmptyAfter === 0 && !finalRoundActive) {
                finalRoundActive = true;
                finalRoundStartPlayer = currentPlayerIdx;
            }

            // If it was a hot dish OR used hot empty tile, consume drink token(s)
            // Key Sir is EXTRA HOT - requires 2x handling

            let drinkMessage = '';
            let drinkTokensUsed = 0;

            if (totalHotHandling > 0) {
                // Handle each hot requirement
                // deferredDrawTarget: if a drink finishes mid-loop, defer the hand refill until after all
                // hot handling is resolved (so injera card discards happen before the hand is topped up).
                let deferredDrawTarget = null;
                for (let hotIdx = 0; hotIdx < totalHotHandling; hotIdx++) {
                    const activeDrinks = currentPlayer.drinks.filter(d => d.tokens > 0);
                    const injeraCardsNow = currentPlayer.hand.filter(c => c.type === 'Clean Injera');

        function getAdjacentEmptyTiles(q, r) {
            // Find all adjacent empty tiles that CAN BE EATEN (not removed AND canEatEmpty AND reachable)
            const neighbors = getNeighbors(q, r);
            const eatableEmptyNeighbors = [];

                const isReachable = currentReachable.some(c => c.q === nCoord.q && c.r === nCoord.r);

            });
            
            if (eatableEmptyNeighbors.length > 0) {

        function updateCanEatEmpty() {
            // Recalculate canEatEmpty for all empty tiles
            let eatableCount = 0;
            boardData.forEach(tile => {
                if (tile.empty && !tile.removed) {
                    // Count neighbors that are nothing (off-board or removed)
                    let emptyNeighbors = 0;
                    const neighbors = getNeighbors(tile.q, tile.r);
                    
                    neighbors.forEach(nCoord => {
                        const neighbor = boardData.find(t => t.q === nCoord.q && t.r === nCoord.r);
                        if (!neighbor) {
                            // Off board
                            emptyNeighbors++;
                        } else if (neighbor.removed) {
                            // Removed tile
                            emptyNeighbors++;
                        }
                    });
                    
                    tile.canEatEmpty = emptyNeighbors >= 2;
                    if (tile.canEatEmpty) eatableCount++;
                }
            });
            console.log('updateCanEatEmpty: Found', eatableCount, 'eatable empty tiles');
        }
        
        function getNeighbors(q, r) {
            // Return all 6 neighbor coordinates
            return [
                {q: q + 1, r: r},
                {q: q + 1, r: r - 1},
                {q: q, r: r - 1},
                {q: q - 1, r: r},
                {q: q - 1, r: r + 1},
                {q: q, r: r + 1}
            ];
        }
        
        function getTrianglesContaining(q, r) {
            const triangles = [];
            const neighbors = getNeighbors(q, r);
            
            for (let i = 0; i < neighbors.length; i++) {
                for (let j = i + 1; j < neighbors.length; j++) {
                    const n1 = neighbors[i];
                    const n2 = neighbors[j];
                    
                    const n1Neighbors = getNeighbors(n1.q, n1.r);
                    const areAdjacent = n1Neighbors.some(n => n.q === n2.q && n.r === n2.r);
                    
                    if (areAdjacent) {
                        const tile1 = boardData.find(t => t.q === q && t.r === r);
                        const tile2 = boardData.find(t => t.q === n1.q && t.r === n1.r);
                        const tile3 = boardData.find(t => t.q === n2.q && t.r === n2.r);
                        
                        if (tile1 && tile2 && tile3 && !tile1.removed && !tile2.removed && !tile3.removed) {
                            triangles.push([tile1, tile2, tile3]);
                        }
                    }
                }
            }
            return triangles;
        }
        
        async function addTahini() {
            const preActionStateTahini = buildStateSnapshot();
            const currentPlayer = playersData[currentPlayerIdx];
            
            // Check if player has tahini card
            const tahiniCards = currentPlayer.hand.filter(c => c.name === 'Tahini');
            if (tahiniCards.length === 0) {
                alert('No Tahini cards in hand!');
                return;
            }
            
            if (!selectedTile) {
                alert('Please select a tile first by clicking on it! This will be the top of the triangle.');
                return;
            }
            
            
            if (selectedTile.removed) {
                alert('This tile has been removed!');
                return;
            }
            
            // Find all triangles containing this tile as the "top"
            const triangles = getTrianglesContaining(selectedTile.q, selectedTile.r);
            
            if (triangles.length === 0) {
                alert('No valid triangles found! Tahini must be placed on a triangle of 3 adjacent tiles.');
                return;
            }
            
            // Categorize triangles by orientation relative to selected tile
            const leftTriangles = [];
            const rightTriangles = [];
            
            triangles.forEach(tri => {
                // Selected tile should be the TOP of the triangle
                // We need to identify which of the 3 tiles is highest (smallest r value)
                const sorted = [...tri].sort((a, b) => {
                    if (a.r !== b.r) return a.r - b.r; // Smaller r = higher up
                    return a.q - b.q;
                });
                
                const top = sorted[0];
                const bottom1 = sorted[1];
                const bottom2 = sorted[2];
                
                // Only include triangles where selected tile is the top
                if (top.q !== selectedTile.q || top.r !== selectedTile.r) {
                    return; // Skip this triangle
                }
                
                // Determine if triangle leans left or right based on bottom tiles
                // Left-leaning: bottom tiles are to the lower-left (smaller q)
                // Right-leaning: bottom tiles are to the lower-right (larger q)
                const avgQ = (bottom1.q + bottom2.q) / 2;
                
                if (avgQ < top.q) {
                    leftTriangles.push([top, bottom1, bottom2]);
                } else if (avgQ > top.q) {
                    rightTriangles.push([top, bottom1, bottom2]);
                }
            });
            
            // Build user-friendly options (SWAPPED arrows)
            const options = [];
            const triangleChoices = [];
            
            if (leftTriangles.length > 0) {
                options.push('◣ Left-leaning triangle');
                triangleChoices.push(leftTriangles[0]);
            }
            
            if (rightTriangles.length > 0) {
                options.push('◢ Right-leaning triangle');
                triangleChoices.push(rightTriangles[0]);
            }
            
            if (options.length === 0) {
                alert('No valid triangles found with this tile as the top!');
                return;
            }
            
            // Choose which triangle orientation
            let selectedIdx = 0;
            if (options.length > 1) {
                selectedIdx = await showSelectionModal('Choose triangle orientation:', options);
                if (selectedIdx === null) return;
            }
            
            saveStateForUndo();
            const triangle = triangleChoices[selectedIdx];

            // Add tahini to all 3 tiles in triangle (only if they don't have dishes or are not removed)
            const tokensToAdd = 1;
            let tilesAffected = 0;
            triangle.forEach(tile => {
                if (!tile.removed) {
                    tile.tahini = (tile.tahini || 0) + tokensToAdd;
                    tilesAffected++;
                }
            });
            
            // Remove tahini card from hand
            const cardIdx = currentPlayer.hand.findIndex(c => c.name === 'Tahini');
            currentPlayer.hand.splice(cardIdx, 1);
            currentPlayer.tahiniCardsPlayed = (currentPlayer.tahiniCardsPlayed || 0) + 1;

            if (preActionStateTahini) recordAction({
                action_type: 'add_tahini',
                player_id: currentPlayerIdx,
                tile_coord: [selectedTile.q, selectedTile.r],
                triangle_orientation: options[selectedIdx].includes('Left') ? 'left' : 'right',
                card_index: 0
            }, preActionStateTahini);

            alert(`Added ${tokensToAdd} tahini token to ${options[selectedIdx]} (${tilesAffected} tiles)!`);
            
            drawBoard();
            updatePlayersPanel();
        }
        
        async function addHotSauce() {
            const preActionStateHotSauce = buildStateSnapshot();
            const currentPlayer = playersData[currentPlayerIdx];

            const hotSauceCards = currentPlayer.hand.filter(c => c.name === 'Add Hot Sauce');
            if (hotSauceCards.length === 0) {
                alert('No Hot Sauce cards in hand!');
                return;
            }

            if (!selectedTile) {
                alert('Please select a tile first by clicking on it! This will be the top of the triangle.');
                return;
            }


            if (selectedTile.removed) {
                alert('This tile has been removed!');
                return;
            }

            const triangles = getTrianglesContaining(selectedTile.q, selectedTile.r);
            if (triangles.length === 0) {
                alert('No valid triangles found! Hot sauce must be placed on a triangle of 3 adjacent tiles.');
                return;
            }

            const leftTriangles = [];
            const rightTriangles = [];
            triangles.forEach(tri => {
                const sorted = [...tri].sort((a, b) => a.r !== b.r ? a.r - b.r : a.q - b.q);
                const top = sorted[0];
                if (top.q !== selectedTile.q || top.r !== selectedTile.r) return;
                const avgQ = (sorted[1].q + sorted[2].q) / 2;
                if (avgQ < top.q) leftTriangles.push(sorted);
                else if (avgQ > top.q) rightTriangles.push(sorted);
            });

            const options = [];
            const triangleChoices = [];
            if (leftTriangles.length > 0) { options.push('◣ Left-leaning triangle'); triangleChoices.push(leftTriangles[0]); }
            if (rightTriangles.length > 0) { options.push('◢ Right-leaning triangle'); triangleChoices.push(rightTriangles[0]); }

            if (options.length === 0) {
                alert('No valid triangles found with this tile as the top!');
                return;
            }

            let selectedIdx = 0;
            if (options.length > 1) {
                selectedIdx = await showSelectionModal('Choose triangle orientation:', options);
                if (selectedIdx === null) return;
            }

            saveStateForUndo();
            const triangle = triangleChoices[selectedIdx];
            let tilesAffected = 0;
            triangle.forEach(tile => {
                if (!tile.removed) {
                    tile.hotSauce = (tile.hotSauce || 0) + 1;
                    tilesAffected++;
                }
            });

            // Remove hot sauce card from hand
            const cardIdx = currentPlayer.hand.findIndex(c => c.name === 'Add Hot Sauce');
            currentPlayer.hand.splice(cardIdx, 1);

            if (preActionStateHotSauce) recordAction({
                action_type: 'add_hot_sauce',
                player_id: currentPlayerIdx,
                tile_coord: [selectedTile.q, selectedTile.r],
                triangle_orientation: options[selectedIdx].includes('Left') ? 'left' : 'right',
                card_index: 0
            }, preActionStateHotSauce);

            alert(`Added hot sauce to ${options[selectedIdx]} (${tilesAffected} tiles)!`);
            drawBoard();
            updatePlayersPanel();
        }

        async function playDrinkCard() {
            const preActionStateDrinkCard = buildStateSnapshot();
            const currentPlayer = playersData[currentPlayerIdx];
            
            // Check if player already has an active drink in their cup
            if (currentPlayer.drinks && currentPlayer.drinks.length > 0) {
                const activeDrink = currentPlayer.drinks[0];
                alert(`Your cup is already filled with ${activeDrink.type} (${activeDrink.tokens} tokens).\nYou must finish it before ordering another drink!`);
                return;
            }
            
            // Find drink cards in hand
            const drinkCards = currentPlayer.hand.filter(c => c.type === 'Drink');
            
            if (drinkCards.length === 0) {
                alert('No drink order cards in hand!');
                return;
            }
            
            // Show selection modal (skip if all drink cards are identical)
            const allSameDrink = drinkCards.every(c => c.name === drinkCards[0].name);
            let selectedIdx = 0;
            if (drinkCards.length > 1 && !allSameDrink) {
                const options = drinkCards.map(card => card.name);
                selectedIdx = await showSelectionModal('Choose a drink to order:', options);
                if (selectedIdx === null) return;
            }

            const selectedCard = drinkCards[selectedIdx];
            
            // Remove card from hand (it's being discarded/used)
            saveStateForUndo();
            const handIdx = currentPlayer.hand.findIndex(c => c.name === selectedCard.name && c.type === 'Drink');
            currentPlayer.hand.splice(handIdx, 1);
            currentPlayer.drinkCardsPlayed = (currentPlayer.drinkCardsPlayed || 0) + 1;
            
            // Extract drink type from card name (e.g., "Order Coffee" -> "Coffee")
            const drinkType = selectedCard.name.replace('Order ', '');
            
            // Fill the cup with the drink (3 tokens)
            currentPlayer.drinks.push({
                type: drinkType,
                tokens: 3
            });
            
            if (preActionStateDrinkCard) recordAction({
                action_type: 'play_drink',
                player_id: currentPlayerIdx,
                drink_card_type: drinkType
            }, preActionStateDrinkCard);

            alert(`Ordered ${drinkType}! Your cup is filled with 3 tokens. The order card has been discarded.`);

            updatePlayersPanel();
            updateGameStatus();
        }
        
        function discardAndRedraw() {
            const currentPlayer = playersData[currentPlayerIdx];
            const n = currentPlayer.hand.length;
            if (n === 0) {
                alert('Your hand is empty — nothing to discard.');
                return;
            }
            if (!confirm(`Discard all ${n} cards and draw ${n - 1}?`)) return;
            saveStateForUndo();
            recordAction({action_type: 'discard_redraw', player_id: currentPlayerIdx});
            currentPlayer.hand = [];
            if (n - 1 > 0) drawCards(currentPlayer, n - 1);
            updatePlayersPanel();
        }

        async function playRotateCard() {
            const preActionStateRotate = buildStateSnapshot();
            const currentPlayer = playersData[currentPlayerIdx];
            
            // Find rotate cards in hand
            const rotateCards = currentPlayer.hand.filter(c => c.name === 'Rotate Injera');
            
            if (rotateCards.length === 0) {
                alert('No Rotate cards in hand!');
                return;
            }
            
            // Ask for direction
            const direction = await showSelectionModal('Choose rotation direction:', [
                'Clockwise (60°)',
                'Counter-clockwise (-60°)'
            ]);
            
            if (direction === null) return;
            
            // Rotate all tiles by transforming their coordinates
            // Hex rotation by 60° clockwise: (q, r) -> (-r, q+r)
            // Hex rotation by 60° counter-clockwise: (q, r) -> (-q-r, q)
            saveStateForUndo();
            boardData.forEach(tile => {
                const oldQ = tile.q;
                const oldR = tile.r;
                
                if (direction === 0) {
                    // Clockwise 60°: (q, r) -> (-r, q+r)
                    tile.q = -oldR;
                    tile.r = oldQ + oldR;
                } else {
                    // Counter-clockwise 60°: (q, r) -> (q+r, -q)
                    tile.q = oldQ + oldR;
                    tile.r = -oldQ;
                }
            });
            
            // Remove card from hand
            const cardIdx = currentPlayer.hand.findIndex(c => c.name === 'Rotate Injera');
            currentPlayer.hand.splice(cardIdx, 1);
            currentPlayer.rotateCardsPlayed = (currentPlayer.rotateCardsPlayed || 0) + 1;

            if (preActionStateRotate) recordAction({
                action_type: 'play_rotate',
                player_id: currentPlayerIdx,
                rotation_direction: direction === 0 ? 'clockwise' : 'counterclockwise',
                card_index: 0
            }, preActionStateRotate);

            alert(`Rotated board ${direction === 0 ? 'clockwise' : 'counter-clockwise'}!`);
            
            // Recalculate everything with new coordinates
            updateCanEatEmpty();
            drawBoard();
            updatePlayersPanel();
        }

            const currentPlayer = playersData[currentPlayerIdx];

            // Find drinks with tokens
            const activeDrinks = currentPlayer.drinks.filter(d => d.tokens > 0);
            
            if (activeDrinks.length === 0) {

            const selectedDrink = activeDrinks[selectedIdx];
            
            // Find the actual drink in the player's drinks array (match by type only, tokens change)
            const drinkIdx = currentPlayer.drinks.findIndex(d => d.type === selectedDrink.type);

            if (preActionStateDrink) recordAction({
                action_type: 'drink_token',
                player_id: currentPlayerIdx,
                drink_index: drinkIdx
            }, preActionStateDrink);

            // Consume token
            saveStateForUndo();
            currentPlayer.drinks[drinkIdx].tokens--;
            currentPlayer.drinkTokensConsumed = currentPlayer.drinkTokensConsumed || {};
            currentPlayer.drinkTokensConsumed[selectedDrink.type] = (currentPlayer.drinkTokensConsumed[selectedDrink.type] || 0) + 1;
            // Points awarded when glass is finished, not per token
            const points = 0;
            currentPlayer.score += points;
            
            console.log('=== DRINK DEBUG ===');
            console.log('Drink type:', selectedDrink.type);
            console.log('Tokens after decrement:', currentPlayer.drinks[drinkIdx].tokens);
            // No immediate beer penalty - applied when drink finishes
            
            // Check if finished
            if (currentPlayer.drinks[drinkIdx].tokens === 0) {
                const result = handleDrinkFinished(currentPlayer, selectedDrink.type);
                currentPlayer.drinks.splice(drinkIdx, 1); // Remove from active drinks

                alert(`Drank ${selectedDrink.type} token!${result.message} Glass removed.`);

                updateGameStatus();

                // Coffee/Beer finished → turn ends
                if (result.shouldEndTurn) {

                }

                updatePlayersPanel();
                updateGameStatus();
            }
        }

        // Handle canvas clicks
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            
            // Find closest tile
            let closestTile = null;
            let minDist = Infinity;
            
            boardData.forEach(tile => {
                const {x, y} = hexToPixel(tile.q, tile.r);
                const dist = Math.sqrt((clickX - x) ** 2 + (clickY - y) ** 2);
                if (dist < minDist && dist < hexSize) {
                    minDist = dist;
                    closestTile = tile;
                }
            });
            
            if (closestTile) {
                selectedTile = closestTile;
                console.log('Selected:', closestTile);
                drawBoard();
            }
        });
        
        
        function calculateReachableTiles() {
            /**
             * Calculate which tiles each player can reach based on their position.
             * Players sit at vertices of a FLAT-TOP hexagon.
             * Each player gets a sector (wedge) of the board.
             */
            
            console.log('Calculating reachable tiles for', numPlayers, 'players...');
            
            // Flat-top hexagon vertices at: 0°, 60°, 120°, 180°, 240°, 300°
            let playerVertices;
            if (numPlayers === 2) {
                playerVertices = [300, 120];  // P1: top-right, P2: bottom-left (opposite)
            } else if (numPlayers === 3) {
                playerVertices = [300, 60, 180];  // 120° apart
            } else if (numPlayers === 4) {
                playerVertices = [300, 0, 120, 180];  // Symmetric pairs
            } else if (numPlayers === 5) {
                playerVertices = [300, 0, 60, 120, 240];  // skip 180°
            } else if (numPlayers === 6) {
                playerVertices = [300, 0, 60, 120, 180, 240];  // all vertices
            }
            
            // Define sector conditions for each vertex angle
            const vertexConditions = {
                0:   (q, r) => q >= 0,           // Right
                60:  (q, r) => q + r >= 0,       // Bottom-right
                120: (q, r) => r >= 0,           // Bottom-left
                180: (q, r) => q <= 0,           // Left
                240: (q, r) => q + r <= 0,       // Top-left
                300: (q, r) => r <= 0            // Top-right
            };
            
            // Calculate reachable tiles for each player
            reachableByPlayer = [];
            
            for (let playerIdx = 0; playerIdx < numPlayers; playerIdx++) {
                const vertexAngle = playerVertices[playerIdx];
                const condition = vertexConditions[vertexAngle];
                const reachable = [];
                
                // Check each tile
                boardData.forEach(tile => {
                    if (!tile.removed && condition(tile.q, tile.r)) {
                        reachable.push({q: tile.q, r: tile.r});
                    }
                });
                
                reachableByPlayer.push(reachable);
                console.log(`Player ${playerIdx} (${vertexAngle}°): ${reachable.length} reachable tiles`);
            }
            
            console.log('✓ Reachable tiles calculated!');
        }
        
        // --- Special Cards Draft Phase ---
        function showMultiSelectModal(title, options, numToKeep) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.style.cssText = `
                    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                    background: rgba(0,0,0,0.7); display: flex;
                    justify-content: center; align-items: center; z-index: 1000;
                `;
                const modal = document.createElement('div');
                modal.style.cssText = `
                    background: white; padding: 30px; border-radius: 15px;
                    max-width: 500px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
                    max-height: 80vh; overflow-y: auto;
                `;
                const titleEl = document.createElement('h2');
                titleEl.textContent = title;
                titleEl.style.cssText = 'margin: 0 0 10px 0; color: #667eea;';
                modal.appendChild(titleEl);

                const subtitle = document.createElement('p');
                subtitle.textContent = `Select ${numToKeep} card${numToKeep > 1 ? 's' : ''} to keep:`;
                subtitle.style.cssText = 'margin: 0 0 15px 0; color: #666;';
                modal.appendChild(subtitle);

                const selected = new Set();
                const buttons = [];

                options.forEach((option, idx) => {
                    const btn = document.createElement('button');
                    btn.innerHTML = `<strong>${option.name}</strong><br><span style="font-size:12px">${option.description}</span>`;
                    btn.style.cssText = `
                        display: block; width: 100%; padding: 12px; margin: 6px 0;
                        background: #f0f0f0; color: #333; border: 2px solid #ddd;
                        border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left;
                    `;
                    btn.onclick = () => {
                        if (selected.has(idx)) {
                            selected.delete(idx);
                            btn.style.background = '#f0f0f0';
                            btn.style.borderColor = '#ddd';
                            btn.style.color = '#333';
                        } else if (selected.size < numToKeep) {
                            selected.add(idx);
                            btn.style.background = '#667eea';
                            btn.style.borderColor = '#5568d3';
                            btn.style.color = 'white';
                        }
                        confirmBtn.disabled = selected.size !== numToKeep;
                        confirmBtn.style.opacity = selected.size === numToKeep ? '1' : '0.5';
                    };
                    buttons.push(btn);
                    modal.appendChild(btn);
                });

                const confirmBtn = document.createElement('button');
                confirmBtn.textContent = `Confirm Selection (${numToKeep})`;
                confirmBtn.disabled = true;
                confirmBtn.style.cssText = `
                    display: block; width: 100%; padding: 14px; margin: 15px 0 0 0;
                    background: #28a745; color: white; border: none; border-radius: 8px;
                    cursor: pointer; font-size: 16px; font-weight: bold; opacity: 0.5;
                `;
                confirmBtn.onclick = () => {
                    if (selected.size === numToKeep) {
                        document.body.removeChild(overlay);
                        resolve(Array.from(selected));
                    }
                };
                modal.appendChild(confirmBtn);
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
            });
        }

        async function runSpecialCardsDraft() {
            if (!specialCardsEnabled || specialCardsDealCount === 0) return;

            // Initialize tracking fields on all players
            playersData.forEach(p => {
                p.specialCards = p.specialCards || [];
                p.tahiniConsumed = p.tahiniConsumed || 0;
                p.hotDishesEaten = p.hotDishesEaten || 0;
                p.totalHotEaten = p.totalHotEaten || 0;
                p.nonHotDishesEaten = p.nonHotDishesEaten || 0;
            });

            // draftPreState is built per-player inside the loop (with that player's dealt cards)

            // Shuffle the deck
            const deck = [...SPECIAL_CARDS_DECK];
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

            // Deal N cards to each player
            const N = specialCardsDealCount;
            const M = specialCardsKeepCount;

            for (let pIdx = 0; pIdx < playersData.length; pIdx++) {
                const dealt = deck.splice(0, N);
                if (dealt.length === 0) break;

                const player = playersData[pIdx];
                // Snapshot includes which cards were dealt to this player (for neural network input)
                const draftPreState = buildStateSnapshot(dealt.map(c => c.id));
                let keptCards;

                if (M >= dealt.length) {
                    // Keep all
                    keptCards = dealt;
                    player.specialCards = dealt.map(c => ({id: c.id, name: c.name, description: c.description}));
                } else if (player.isAI) {
                    // AI: random selection
                    const shuffled = [...dealt];
                    for (let i = shuffled.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                    }
                    keptCards = shuffled.slice(0, M);
                    player.specialCards = keptCards.map(c => ({id: c.id, name: c.name, description: c.description}));
                } else {
                    // Human: show selection modal
                    const selectedIndices = await showMultiSelectModal(
                        `${player.name} - Choose your secret cards`,
                        dealt,
                        M
                    );
                    keptCards = selectedIndices.map(i => dealt[i]);
                    player.specialCards = keptCards.map(c => ({
                        id: c.id, name: c.name, description: c.description
                    }));
                }

                recordAction({
                    action_type: 'select_special_cards',
                    player_id: pIdx,
                    dealt_cards: dealt.map(c => ({id: c.id, name: c.name})),
                    kept_cards: keptCards.map(c => ({id: c.id, name: c.name}))
                }, draftPreState);  // state already has draft_dealt_cards set

                console.log(`${player.name} got special cards:`, player.specialCards.map(c => c.name));
            }
        }

        // Initial draw
        randomizeInitialState();
        calculateReachableTiles(); // Randomize cards on each game start
        console.log('Initial board data:', boardData.filter(t => t.empty).map(t => ({q: t.q, r: t.r, canEatEmpty: t.canEatEmpty})));
        updateCanEatEmpty();
        console.log('After updateCanEatEmpty:', boardData.filter(t => t.empty).map(t => ({q: t.q, r: t.r, canEatEmpty: t.canEatEmpty})));
        drawBoard();
        updatePlayersPanel();
        updateGameStatus();

        // Run special cards draft (async - UI will update when done)
        runSpecialCardsDraft().then(() => {
            updatePlayersPanel();
        });
    </script>
